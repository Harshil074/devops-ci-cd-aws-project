name: CI-CD Pipeline

on:
  push:
    branches:
      - main

# Common env for all jobs
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}          # e.g. ap-south-1
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}  # e.g. devops-ci-cd-app
  IMAGE_TAG: latest

jobs:
  # ------------------------------------------------
  # 1) Build and push image to AWS ECR
  # ------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- yahi step dono errors fix karega ----
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
          | docker login --username AWS --password-stdin "${{ secrets.ECR_REGISTRY }}"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  # ------------------------------------------------
  # 2) Deploy latest image on EC2
  # ------------------------------------------------
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}          # e.g. 13.x.x.x
          username: ${{ secrets.EC2_USER }}      # e.g. ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}        # private key content
          script: |
            AWS_REGION=${{ env.AWS_REGION }}
            ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            ECR_REPO=${{ env.ECR_REPOSITORY }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}

            # EC2 pe IAM Role laga hua hai, isliye yahi login kaafi hai
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            docker pull "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"

            # Purana container band + delete
            docker stop devops-ci-cd-app || true
            docker rm devops-ci-cd-app || true

            # Naya container run
            docker run -d --name devops-ci-cd-app -p 3000:3000 \
              "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
