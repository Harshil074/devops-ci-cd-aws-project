name: CI-CD Pipeline

on:
  push:
    branches:
      - main

# Ye env dono jobs (build + deploy) ko milenge
env:
  AWS_REGION: ap-south-1                    # <- tumhara region
  ECR_REPOSITORY: devops-ci-cd-app          # <- ECR repo name
  IMAGE_TAG: ${{ github.sha }}              # <- har commit ka unique tag (NO 'latest')

jobs:
  # ---------------------------------------------------------
  # 1) Build + Push image to ECR
  # ---------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .

      - name: Tag image for Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag $ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ---------------------------------------------------------
  # 2) Deploy image on EC2
  # ---------------------------------------------------------
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (for ECR login output)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR (to get registry URL)
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy on EC2 using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REGION="${{ env.AWS_REGION }}"
            ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            ECR_REPOSITORY="${{ env.ECR_REPOSITORY }}"
            IMAGE_TAG="${{ env.IMAGE_TAG }}"

            echo "Logging into ECR from EC2..."
            aws ecr get-login-password --region "$REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "Pulling latest image for this commit..."
            docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Stopping old container (if exists)..."
            docker stop devops-ci-cd-app || true
            docker rm devops-ci-cd-app || true

            echo "Starting new container..."
            docker run -d --name devops-ci-cd-app -p 80:3000 \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
