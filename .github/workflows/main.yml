name: CI-CD Pipeline

on:
  push:
    branches:
      - main

# Common env (yaha secrets use kar sakte hain)
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: latest

jobs:
  # ---------------------------------------------------
  # 1) Build image & push to AWS ECR
  # ---------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 👇 Yahi step tumhare dono errors fix karega:
      # - docker build normal command se
      # - ECR registry ko env me leke, YAML expression error nahi aayega
            - name: Disable buildx
        run: docker buildx rm default || true

      - name: Build, tag and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          echo "Registry   : $ECR_REGISTRY"
          echo "Repository : $ECR_REPOSITORY"
          echo "Image tag  : $IMAGE_TAG"

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # ---------------------------------------------------
  # 2) Deploy to EC2 (sirf tab chalega jab build-and-push success ho)
  # ---------------------------------------------------
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user          # Amazon Linux / default username
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # AWS region set karo
            AWS_REGION=${{ env.AWS_REGION }}

            # Yaha apna AWS account id daal do (screenshot me jo tha):
            ACCOUNT_ID=225220763539
            ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
            ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}

            echo "Logging in to ECR inside EC2..."
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "Pulling latest image..."
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "Stopping old container (if exists)..."
            docker stop devops-ci-cd-app || true
            docker rm devops-ci-cd-app || true

            echo "Starting new container..."
            docker run -d -p 80:3000 --name devops-ci-cd-app \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
