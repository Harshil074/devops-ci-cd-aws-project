name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1              # <- tumhara region
  ECR_REPOSITORY: devops-ci-cd-app    # <- ECR repo name
  IMAGE_TAG: latest

# -------------------------------------------------
# 1) BUILD & PUSH IMAGE TO ECR
# -------------------------------------------------
jobs:
  build-and-push:
    name: Build and push image to ECR
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js setup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      # 3. Dependencies install
      - name: Install dependencies
        run: npm install

      # 4. AWS credentials configure
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Login to ECR (official action)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker image build
      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .

      # 7. Tag image for Amazon ECR
      - name: Tag image for Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 8. Push image to ECR
      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

# -------------------------------------------------
# 2) DEPLOY TO EC2 (USING SSH)
# -------------------------------------------------
  deploy-to-ec2:
    name: Deploy on EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # 1. AWS creds (taaki EC2 ke andar bhi AWS CLI kaam kare)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. ECR registry URL nikalne ke liye login (runner pe, sirf URL ke liye)
      - name: Login to Amazon ECR (get registry URL)
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 3. EC2 par SSH karke deploy
      - name: Deploy on EC2 using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}     # 13.201.129.197
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # ---- Values injected by GitHub before sending script ----
            ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}
            APP_NAME=devops-ci-cd-app

            echo "Using ECR registry: $ECR_REGISTRY"
            echo "Pulling image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            # 1) ECR login on EC2
            aws ecr get-login-password --region ${AWS_REGION} \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 2) Latest image pull
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # 3) Purana container delete (agar exist karta ho)
            docker rm -f $APP_NAME || true

            # 4) Naya container run
            docker run -d --name $APP_NAME -p 80:3000 \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
